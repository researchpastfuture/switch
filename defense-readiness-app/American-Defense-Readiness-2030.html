  .wrap { display:grid; grid-template-columns:300px 1fr; min-height:100vh; }
  /* Sidebar */
  aside {

  .search { width:100%; padding:9px 11px; border-radius:10px; border:1px solid var(--line);

  nav ol { list-style:none; margin:0; padding:0; }
  nav li a { display:flex; gap:8px; padding:7px 9px; border-radius:8px; color:var(--ink); font-size:13.5px; }
  nav li a:hover { background:var(--panel); text-decoration:none; }
  nav li a .n { color:var(--muted); min-width:20px; }
  nav li a.hidden { display:none; }
  /* Main */
  main { padding:36px clamp(20px,5vw,72px); max-width:1000px; }
  header.doc { border-bottom:1px solid var(--line); padding-bottom:22px; margin-bottom:30px; }
  header.doc .tag { color:var(--accent); font-weight:600; letter-spacing:.04em; text-transform:uppercase; font-size:12px; }
  header.doc h1 { font-size:34px; margin:8px 0 4px; line-height:1.15; }
  header.doc h2 { font-size:19px; color:var(--muted); font-weight:500; margin:0 0 14px; }
  header.doc .meta { color:var(--muted); font-size:13px; }
  section.sec { padding:30px 0; border-bottom:1px solid var(--line); scroll-margin-top:20px; }
  section.sec .kicker { color:var(--accent); font-size:13px; font-weight:600; }
  section.sec h2.title { font-size:25px; margin:6px 0 10px; line-height:1.2; }
  section.sec .summary { color:var(--muted); font-style:italic; margin-bottom:16px; }

  .tool .tool-kind { color:var(--muted); font-size:12px; margin-bottom:14px; }

  .between { justify-content:space-between; }
  label.ck { display:flex; gap:10px; align-items:flex-start; padding:7px 0; cursor:pointer; }
  label.ck input { margin-top:4px; }
  .bar { height:10px; border-radius:6px; background:var(--line); overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--accent); }
  .pill { font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); cursor:pointer; }
  .pill.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .muted { color:var(--muted); }
  .big { font-size:30px; font-weight:700; }
  input[type=number],input[type=range]{ accent-color:var(--accent); }
  input[type=number]{ width:120px; padding:7px 9px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  .btn { padding:8px 13px; border-radius:9px; border:1px solid var(--line); background:var(--panel2);
    color:var(--ink); cursor:pointer; font-size:13.5px; }
  .btn:hover { border-color:var(--accent); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .out { white-space:pre-wrap; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px;
    background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:14px; }

  .marker { position:absolute; transform:translate(-50%,-50%); width:18px; height:18px; border-radius:50%;

  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:8px; }
  .swatch { display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:middle; margin-right:5px; }
  .tl { border-left:2px solid var(--line); margin-left:8px; padding-left:18px; }
  .tl .mil { position:relative; padding:10px 0; }
  .tl .mil::before { content:""; position:absolute; left:-25px; top:16px; width:11px; height:11px;

  details { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; background:var(--panel2); }
  summary { cursor:pointer; font-weight:600; }
  .footer { color:var(--muted); font-size:13px; padding:30px 0; }
  @media (max-width:880px){ .wrap{ grid-template-columns:1fr; } aside{ position:static; height:auto; } .grid2{ grid-template-columns:1fr; } }

const $ = (s,r=document)=>r.querySelector(s);

  const n=document.createElement(tag);
  for(const k in attrs){ if(k==="class")n.className=attrs[k]; else if(k.startsWith("on"))n.addEventListener(k.slice(2),attrs[k]); else if(k==="html")n.innerHTML=attrs[k]; else n.setAttribute(k,attrs[k]); }
  for(const c of kids.flat()){ if(c==null)continue; n.append(c.nodeType?c:document.createTextNode(c)); }
  return n;
};

          el("span",{class:"muted"}, `${g.value} / target ${g.target}`)),
        el("div",{class:"bar",style:"margin:8px 0 4px"}, el("span",{style:`width:${g.value}%`})),
        g.note? el("div",{class:"muted",style:"font-size:12px"}, g.note):null));
    });
    return box;
  },

  "concept-explorer": ()=> {
    const box=el("div");
    DATA.concepts.forEach(c=>{
      box.append(el("details",{},
        el("summary",{},c.term),
        el("p",{class:"muted",style:"margin:8px 0"},c.definition),
        el("div",{class:"row"}, c.indicators.map(i=>el("span",{class:"pill"},i)))));
    });
    return box;
  },

  "risk-assessment-checklist": ()=> {
    const d=DATA.deterrenceChecklist, box=el("div");
    const out=el("div",{class:"card",style:"margin-bottom:14px"});
    const list=el("div");
    const checked={};
    const render=()=>{
      const score=d.items.reduce((s,i)=>s+(checked[i.id]?i.weight:0),0);
      let band=d.bands[0]; d.bands.forEach(b=>{ if(score>=b.min)band=b; });
      out.innerHTML="";
      out.append(el("div",{class:"row between"},el("span",{class:"big"},score+""),
        el("strong",{},band.label)),
        el("div",{class:"bar",style:"margin:8px 0"},el("span",{style:`width:${Math.min(score,100)}%`})),
        el("div",{class:"muted",style:"font-size:13px"},band.note));
    };
    d.items.forEach(i=>{
      const cb=el("input",{type:"checkbox",onchange:e=>{checked[i.id]=e.target.checked;render();}});
      list.append(el("label",{class:"ck"},cb,el("span",{},`${i.label} `,el("span",{class:"muted"},`(+${i.weight})`))));
    });
    box.append(out,list); render(); return box;
  },

  "intel-source-builder": ()=> {
    const d=DATA.intelSources, box=el("div");
    const on={};
    const cov=el("div",{class:"card",style:"margin-bottom:14px"});
    const render=()=>{
      const covered=new Set(d.sources.filter(s=>on[s.id]).map(s=>s.category));
      cov.innerHTML="";
      cov.append(el("div",{class:"row between"},
        el("span",{},"Category coverage"),
        el("strong",{},`${covered.size} / ${d.categories.length}`)));
      cov.append(el("div",{class:"row",style:"margin-top:8px"},
        d.categories.map(c=>el("span",{class:"pill"+(covered.has(c)?" on":"")},c))));
    };
    box.append(cov);
    d.sources.forEach(s=>{
      box.append(el("label",{class:"ck"},
        el("input",{type:"checkbox",onchange:e=>{on[s.id]=e.target.checked;render();}}),
        el("span",{}, el("strong",{},s.name),
          el("span",{class:"pill",style:`margin-left:8px;border-color:${catColor(s.kind)};color:${catColor(s.kind)}`},s.kind),
          el("div",{class:"muted",style:"font-size:12.5px"},`${s.category} — ${s.description}`))));
    });
    render(); return box;
  },

  "threat-map": ()=> {
    const d=DATA.threats, box=el("div");
    const active=new Set(d.categories);
    const map=el("div",{class:"map"});
    const detail=el("div",{class:"muted",style:"margin-top:10px;min-height:20px"},"Click a marker for detail.");
    const filters=el("div",{class:"row",style:"margin-bottom:10px"});
    const render=()=>{
      map.innerHTML="";
      d.markers.filter(m=>active.has(m.category)).forEach(m=>{
        const size=10+m.severity*4;
        map.append(el("div",{class:"marker",title:m.label,
          style:`left:${m.x}%;top:${m.y}%;width:${size}px;height:${size}px;background:${catColor(m.category)}`,
          onclick:()=>{ detail.textContent=`${m.label} — ${m.category} (severity ${m.severity}): ${m.detail}`; }}));
      });
    };
    d.categories.forEach(c=>{
      filters.append(el("span",{class:"pill on",
        onclick:e=>{ if(active.has(c)){active.delete(c);e.target.classList.remove("on");}else{active.add(c);e.target.classList.add("on");} render(); }},
        el("span",{class:"swatch",style:`background:${catColor(c)}`}),c));
    });
    const legend=el("div",{class:"legend"},
      el("span",{},el("span",{class:"swatch",style:"background:#22c55e"}),"sev 1"),
      el("span",{},el("span",{class:"swatch",style:"background:#f59e0b"}),"sev 2"),
      el("span",{},el("span",{class:"swatch",style:"background:#ef4444"}),"sev 3"),
      el("span",{class:"muted"},"(marker color = category, size = severity)"));
    box.append(filters,map,legend,detail); render(); return box;
  },

  "stockpile-planner": ()=> {
    const d=DATA.stockpile, box=el("div");
    const inp=el("input",{type:"number",min:"0",value:d.defaultPopulation});
    const tbody=el("tbody");
    const render=()=>{
      const pop=Math.max(0,+inp.value||0);
      tbody.innerHTML="";
      d.items.forEach(i=>{
        const qty=Math.round(pop*i.perThousand/1000);
        tbody.append(el("tr",{},el("td",{},i.label),
          el("td",{},`${i.perThousand} / 1k`),
          el("td",{},el("strong",{},`${fmt(qty)} ${i.unit}`))));
      });
    };
    inp.addEventListener("input",render);
    box.append(el("div",{class:"row",style:"margin-bottom:12px"},
      el("span",{},"Population served:"),inp),
      el("table",{},el("thead",{},el("tr",{},el("th",{},"Item"),el("th",{},"Rate"),el("th",{},"Recommended"))),tbody));
    render(); return box;
  },

  "brigade-builder": ()=> {
    const d=DATA.brigade, box=el("div");
    const inp=el("input",{type:"number",min:"0",value:d.defaultStudents});
    const tbody=el("tbody");
    const render=()=>{
      const students=Math.max(0,+inp.value||0);
      const mult=students/d.studentsPer;
      tbody.innerHTML="";
      d.roles.forEach(r=>{
        const rec=Math.min(r.max,Math.ceil(r.recommendedPer*mult));
        tbody.append(el("tr",{},el("td",{},r.label),
          el("td",{},`${r.recommendedPer} / ${d.studentsPer}`),
          el("td",{},el("strong",{},rec+""))));
      });
    };
    inp.addEventListener("input",render);
    box.append(el("div",{class:"row",style:"margin-bottom:12px"},el("span",{},"Students:"),inp),
      el("table",{},el("thead",{},el("tr",{},el("th",{},"Role"),el("th",{},"Ratio"),el("th",{},"Recommended"))),tbody));
    render(); return box;
  },

  "protocol-stepper": ()=> {
    const d=DATA.rescueProtocol, box=el("div");
    const done={};
    const prog=el("div",{class:"bar",style:"margin-bottom:14px"},el("span",{style:"width:0%"}));
    const render=()=>{ const c=Object.values(done).filter(Boolean).length;
      prog.firstChild.style.width=`${Math.round(c/d.steps.length*100)}%`; };
    d.steps.forEach((s,idx)=>{
      box.append(el("label",{class:"ck"},
        el("input",{type:"checkbox",onchange:e=>{done[idx]=e.target.checked;render();}}),
        el("span",{}, el("strong",{},`${idx+1}. ${s.title}`),
          el("div",{class:"muted",style:"font-size:13px"},s.detail))));
    });
    return el("div",{},prog,box);
  },

  "pledge-commitment-tracker": ()=> buildSelector(DATA.pledge.commitments, DATA.pledge.intro, "My Pledge"),
  "covenant-builder": ()=> buildSelector(DATA.covenant.principles, DATA.covenant.preamble, "Our Covenant"),

  "fund-allocation-simulator": ()=> {
    const d=DATA.fundBuckets, box=el("div");
    const vals={}; d.buckets.forEach(b=>vals[b.id]=b.defaultPct);
    const total=el("div",{class:"row between",style:"margin-bottom:10px"});
    const barStack=el("div",{class:"bar",style:"height:18px;margin-bottom:14px;display:flex"});
    const rows=el("div");
    const render=()=>{
      const sum=Object.values(vals).reduce((a,b)=>a+b,0);
      total.innerHTML="";
      total.append(el("strong",{},d.totalLabel),
        el("span",{class:sum===100?"":"",style:`color:${sum===100?'#22c55e':'#f59e0b'}`},`Total: ${sum}%`));
      barStack.innerHTML="";
      d.buckets.forEach(b=>barStack.append(el("span",{style:`width:${vals[b.id]}%;background:${b.color};height:100%`})));
    };
    d.buckets.forEach(b=>{
      const num=el("span",{class:"muted"},vals[b.id]+"%");
      const r=el("input",{type:"range",min:"0",max:"100",value:vals[b.id],style:"flex:1",
        oninput:e=>{vals[b.id]=+e.target.value;num.textContent=vals[b.id]+"%";render();}});
      rows.append(el("div",{class:"row",style:"margin:6px 0"},
        el("span",{style:`min-width:170px`},el("span",{class:"swatch",style:`background:${b.color}`}),b.label),
        r,num));
    });
    box.append(total,barStack,rows); render(); return box;
  },

  "bill-template-generator": ()=> {
    const d=DATA.billTemplate, box=el("div");
    const sel={}; const titleInp=el("input",{type:"number"});
    const out=el("div",{class:"out"});
    const nameInp=el("input",{class:"search",style:"margin-bottom:10px",placeholder:"Short title of the Act (e.g., The Protect Our Children Act)"});
    const render=()=>{
      const chosen=d.provisions.filter(p=>sel[p.id]);
      out.textContent = `${d.titlePrefix}\nTo establish ${nameInp.value||"[short title]"}.\n\n`
        + (chosen.length? chosen.map(p=>p.text).join("\n\n") : "Select provisions below to assemble the bill text.");
    };
    nameInp.addEventListener("input",render);
    const list=el("div");
    d.provisions.forEach(p=>{
      list.append(el("label",{class:"ck"},
        el("input",{type:"checkbox",onchange:e=>{sel[p.id]=e.target.checked;render();}}),
        el("span",{},p.label)));
    });
    const copy=el("button",{class:"btn",style:"margin-top:10px",
      onclick:()=>{navigator.clipboard&&navigator.clipboard.writeText(out.textContent);copy.textContent="Copied!";setTimeout(()=>copy.textContent="Copy bill text",1200);}},"Copy bill text");
    box.append(nameInp,list,out,copy); render(); return box;
  },

  "deprogramming-pathway": ()=> {
    const d=DATA.deprogramming, box=el("div");
    box.append(el("div",{class:"stub",style:"margin-bottom:12px"},d.disclaimer));
    const view=el("div",{class:"card"});
    const go=(id)=>{
      const node=d.nodes[id]; view.innerHTML="";
      if(node.outcome){
        view.append(el("p",{},el("strong",{},"Suggested next step:")),el("p",{class:"muted"},node.outcome),
          el("button",{class:"btn",onclick:()=>go(d.start)},"Start over"));
      } else {
        view.append(el("p",{},el("strong",{},node.prompt)),
          el("div",{class:"row"},node.options.map(o=>el("button",{class:"btn",onclick:()=>go(o.next)},o.label))));
      }
    };
    go(d.start); box.append(view); return box;
  },

  "surveillance-detox-checklist": ()=> {
    const d=DATA.detoxChecklist, box=el("div");
    const all=d.categories.flatMap(c=>c.items);
    const done={};
    const prog=el("div",{},el("div",{class:"row between"},el("span",{},"Progress"),el("strong",{class:"pcount"},"0%")),
      el("div",{class:"bar",style:"margin:8px 0 16px"},el("span",{style:"width:0%"})));
    const render=()=>{ const c=Object.values(done).filter(Boolean).length;
      const pct=Math.round(c/all.length*100);
      $(".pcount",prog).textContent=pct+"%"; $(".bar>span",prog).style.width=pct+"%"; };
    d.categories.forEach(cat=>{
      const block=el("div",{style:"margin-bottom:12px"},el("strong",{},cat.label));
      cat.items.forEach(i=>block.append(el("label",{class:"ck"},
        el("input",{type:"checkbox",onchange:e=>{done[i.id]=e.target.checked;render();}}),el("span",{},i.label))));
      box.append(block);
    });
    return el("div",{},prog,box);
  },

  "deployment-timeline": ()=> {
    const d=DATA.timeline, box=el("div");
    let active="All";
    const tl=el("div",{class:"tl"});
    const render=()=>{
      tl.innerHTML="";
      d.milestones.filter(m=>active==="All"||m.region===active).forEach(m=>{
        tl.append(el("div",{class:"mil"},
          el("div",{class:"row"},el("strong",{},`${m.phase} · ${m.period}`),
            el("span",{class:"pill",style:`border-color:${catColor(m.region)};color:${catColor(m.region)}`},m.region)),
          el("div",{},m.title),el("div",{class:"muted",style:"font-size:13px"},m.detail)));
      });
    };
    const filters=el("div",{class:"row",style:"margin-bottom:12px"});
    ["All",...d.regions].forEach(r=>filters.append(el("span",{class:"pill"+(r==="All"?" on":""),
      onclick:e=>{active=r;[...filters.children].forEach(c=>c.classList.remove("on"));e.target.classList.add("on");render();}},r)));
    box.append(filters,tl); render(); return box;
  },

  "metrics-dashboard": ()=> {
    const box=el("div");
    DATA.metrics.forEach(m=>{
      const pct=Math.round((m.current-m.baseline)/(m.target-m.baseline)*100);
      box.append(el("div",{class:"card",style:"margin-bottom:10px"},
        el("div",{class:"row between"},el("strong",{},m.label),el("span",{class:"muted"},pct+"% to target")),
        el("div",{class:"bar",style:"margin:8px 0 4px"},el("span",{style:`width:${pct}%;background:#22c55e`})),
        el("div",{class:"muted",style:"font-size:12.5px"},`baseline ${fmt(m.baseline)} ${m.unit} · current ${fmt(m.current)} · target ${fmt(m.target)}`)));
    });
    return box;
  },

  "appendix-explorer": ()=> {
    const d=DATA.glossary, box=el("div");
    box.append(el("strong",{},"Reference assets"));
    d.assets.forEach(a=>box.append(el("div",{class:"card",style:"margin:8px 0"},
      el("a",{href:a.href},a.label),el("div",{class:"muted",style:"font-size:13px"},a.description))));
    box.append(el("strong",{style:"display:block;margin-top:14px"},"Glossary"));
    const search=el("input",{class:"search",style:"margin:10px 0",placeholder:"Search terms…"});
    const list=el("div");
    const render=()=>{ const q=search.value.toLowerCase(); list.innerHTML="";
      d.glossary.filter(g=>!q||g.term.toLowerCase().includes(q)||g.definition.toLowerCase().includes(q))
        .forEach(g=>list.append(el("div",{style:"padding:7px 0;border-bottom:1px solid var(--line)"},
          el("strong",{},g.term),el("div",{class:"muted",style:"font-size:13.5px"},g.definition)))); };
    search.addEventListener("input",render);
    box.append(search,list); render(); return box;
  },
};

function buildSelector(items, intro, heading){
  const box=el("div");
  const sel={};
  const out=el("div",{class:"out"});
  const render=()=>{
    const chosen=items.filter(i=>sel[i.id]);
    out.textContent = `${heading}\n\n${intro}\n\n` + (chosen.length? chosen.map(i=>"• "+i.text).join("\n") : "(select commitments below)");
  };
  const list=el("div");
  items.forEach(i=>list.append(el("label",{class:"ck"},
    el("input",{type:"checkbox",onchange:e=>{sel[i.id]=e.target.checked;render();}}),el("span",{},i.text))));
  const print=el("button",{class:"btn",style:"margin-top:10px",onclick:()=>window.print()},"Print");
  box.append(el("p",{class:"muted"},intro),list,out,print); render(); return box;
}

/* ============================================================================
   PAGE BUILD
   ============================================================================ */
$("#site-title").textContent=SITE.title;
$("#site-sub").textContent=SITE.subtitle;
$("#doc-tagline").textContent=SITE.tagline;
$("#doc-title").textContent=SITE.title;
$("#doc-subtitle").textContent=SITE.subtitle;
$("#doc-meta").textContent=`${SITE.author} · ${SITE.partners} · ${SITE.version}`;

const toc=$("#toc"), secWrap=$("#sections");
SECTIONS.forEach(s=>{
  toc.append(el("li",{},el("a",{href:"#"+s.slug,"data-title":s.title.toLowerCase()},
    el("span",{class:"n"},s.n+"."),el("span",{},s.title))));

  const sec=el("section",{class:"sec",id:s.slug},
    el("div",{class:"kicker"},`Section ${s.n}`),
    el("h2",{class:"title"},s.title),
    el("div",{class:"summary"},s.summary),
    el("div",{class:"body"},
      el("p",{},s.summary),
      el("div",{class:"stub"},"Full section prose pending — drop your white-paper text for this section here (replaces this placeholder).")),
    el("div",{class:"tool"},
      el("h3",{},"Interactive tool"),
      el("div",{class:"tool-kind"},s.tool),
      (TOOLS[s.tool]||(()=>el("div",{class:"muted"},"(tool)")))()));
  secWrap.append(sec);
});

/* search filter */
$("#search").addEventListener("input",e=>{
  const q=e.target.value.toLowerCase();
  toc.querySelectorAll("a").forEach(a=>{
    a.classList.toggle("hidden", q && !a.dataset.title.includes(q));
  });
});
</script>
</body>
</html>
