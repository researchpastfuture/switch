mode: working
modes:
  cautious:
    metering: hard_cap
    max_concurrent_agents: 4
    max_budget_usd_per_agent: 5
    session_budget_usd_cap: 50
    require_approval_before_merge: true
    auto_preview_deploy: true
  working:
    metering: usage_metered
    max_concurrent_agents: 12
    max_budget_usd_per_agent: 15
    alert_thresholds_usd:
    - 100
    - 500
    - 1000
    require_approval_before_merge: true
    auto_preview_deploy: true
  production:
    metering: usage_metered
    max_concurrent_agents: 60
    max_budget_usd_per_agent: 30
    alert_thresholds_usd:
    - 500
    - 1000
    - 3000
    - 5000
    require_approval_before_merge: true
    auto_preview_deploy: true
