product: outreachfirst

allowed_tools:
  - Read
  - Edit
  - Write
  - Glob
  - Grep
  - Bash(node *)
  - Bash(npm *)
  - Bash(npx *)
  - Bash(git status)
  - Bash(git diff*)
  - Bash(git add*)
  - Bash(git commit*)
  - Bash(git push origin*)
  - Bash(git log*)
  - Bash(git branch*)
  - Bash(git checkout*)
  - Bash(ls*)
  - Bash(find*)
  - Bash(cat*)

disallowed_tools:
  - Bash(rm -rf*)
  - Bash(git push --force*)
  - Bash(git push -f*)
  - Bash(git reset --hard*)
  - Bash(npm i -g*)
  - Bash(brew install*)

protected_paths:
  - ".env"
  - "*.key"
  - "*.pem"
  - "vercel.json"
  - ".github/workflows/**"

principles:
  - "OutreachFirst is a Vercel-hosted static + serverless app (vercel.json + api/). Don't add server-side state — it's deliberately stateless."
  - "Don't send unsolicited outreach from any agent code path."
  - "AF protective voice."
